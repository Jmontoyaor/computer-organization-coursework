; =============================================================================
;  gateway_cli_pwm - Reloj, PWM, boton, CLI y perifericos en el gateway
;  Placa: ST B-L072Z-LRWAN1 (STM32L072CZ + SX1276 en el modulo Murata).
;  Es la misma placa del gateway LoRa de Redsiliente; este firmware la usa para
;  practicar y verificar con Logic 2 los perifericos que pide la guia del curso.
;
;    pio run                 -> compilar
;    pio run -t upload       -> cargar por ST-LINK (USB CN7)
;    pio device monitor      -> CLI por el puerto COM virtual (115200 8N1)
; =============================================================================
[platformio]
default_envs = lrwan1_cli

[env:lrwan1_cli]
; Misma version de plataforma que firmware/gateway_receiver.
platform = platformio/ststm32@20.0.0
board = disco_l072cz_lrwan1
framework = arduino
upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200
; La CLI hace eco de lo que se escribe; el monitor envia la linea con Enter.
monitor_echo = no
monitor_eol = CRLF

build_flags =
    -D SERIAL_BAUD=115200
    ; 1 = activa la resistencia interna de pull-up en el boton B1 (PB2).
    ; Dejar en 0 si la placa ya tiene resistencia externa (ver README).
    -D BUTTON_INTERNAL_PULLUP=0
    -Wall
